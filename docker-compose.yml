services:
  neo4j:
    image: neo4j:4.4.11
    container_name: vullink-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (used by API and by the frontend in the browser)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
      - ./data/neo4j-import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: ./VulLink-Visualizer
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
        REACT_APP_NEO4J_URL: ${REACT_APP_NEO4J_URL}
        REACT_APP_NEO4J_USER: ${REACT_APP_NEO4J_USER}
        REACT_APP_NEO4J_PASSWORD: ${REACT_APP_NEO4J_PASSWORD}
    container_name: vullink-frontend
    ports:
      - "80:80"
    env_file:
      - ./VulLink-Visualizer/.env
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./VulLink-API
    container_name: vullink-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - ./VulLink-API/.env
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
